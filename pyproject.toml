[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seedstartgate"
version = "1.0.0"
description = "Offline fixed-offset seed-treatment do-not-start calendar compiler"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SeedStartGate contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.scripts]
seedstartgate = "seedstartgate.cli:main"

[project.urls]
Repository = "https://github.com/waxwingfactor/seedstartgate"
Issues = "https://github.com/waxwingfactor/seedstartgate/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seedstartgate = ["data/*.json", "data/*.txt"]
