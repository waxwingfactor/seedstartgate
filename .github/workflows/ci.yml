name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check build==1.3.0 setuptools==80.9.0 wheel==0.45.1
      - run: python -m build --no-isolation
      - run: python scripts/build_zipapp.py
      - name: Install wheel and run independent acceptance tests
        shell: bash
        run: |
          python -m pip install --no-index --no-deps dist/*.whl
          SEEDSTARTGATE_TEST_INSTALLED=1 python -m unittest discover -s tests -v
          python -I scripts/installed_smoke.py
      - name: Install sdist and run installed workflow
        shell: bash
        run: |
          python -m pip uninstall -y seedstartgate
          python -m pip install --no-build-isolation --no-index --no-deps dist/*.tar.gz
          python -I scripts/installed_smoke.py
      - name: Verify standalone zipapp
        run: python -I scripts/installed_smoke.py dist/seedstartgate.pyz
  required:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported platform test
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
